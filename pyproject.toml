[project]
name = "novelwriter"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "deepagents==0.4",
    "markdown==3.10",
    "langgraph-checkpoint-mongodb==0.3.1",
    "pymongo==4.15",
    "pyyaml>=6.0.3",
    "langchain>=1.2.12",
    "langgraph>=1.1.2",
    "pydantic-settings>=2.12.1",
    "langchain-google-genai",
    "langgraph-checkpoint-sqlite"
]

[tool.ruff]
target-version = "py312"
line-length = 120
exclude = [".git", ".venv", "__pycache__", "build", "dist"]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = [
    "I",      # isort
    "UP",     # pyupgrade
]
ignore = ["E501"]  # line length handled by formatter

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
